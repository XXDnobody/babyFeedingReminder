server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: baby-feeding-reminder
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/baby_feeding?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.baby.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:babyFeedingReminderSecretKey2025VeryLongSecureKey}
  expiration: 604800000

# APNs配置
apns:
  enabled: ${APNS_ENABLED:false}
  production: ${APNS_PRODUCTION:false}
  certificate-path: ${APNS_CERTIFICATE_PATH:classpath:apns/apns-dev.p12}
  certificate-password: ${APNS_CERTIFICATE_PASSWORD:}
  topic: ${APNS_TOPIC:com.baby.feedingreminder}

# 日志配置
logging:
  level:
    com.baby: INFO
    org.springframework: WARN
  file:
    name: /var/log/baby-feeding/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Actuator健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
