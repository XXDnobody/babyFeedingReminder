version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baby-feeding-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/baby_feeding?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - baby-network
    restart: unless-stopped
    # 资源限制配置（2核4G服务器优化）
    deploy:
      resources:
        limits:
          cpus: '1.5'        # 后端最多使用1.5核
          memory: 2G         # 后端最多使用2GB内存
        reservations:
          cpus: '0.5'        # 至少预留0.5核
          memory: 512M       # 至少预留512MB

  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: baby-feeding-mysql
    ports:
      - "3307:3306"  # 使用 3307 端口避免与本地MySQL冲突
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4'
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=baby_feeding
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
      - LANG=C.UTF-8
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - baby-network
    restart: unless-stopped
    # 资源限制配置
    deploy:
      resources:
        limits:
          cpus: '1.0'        # MySQL最多使用1核
          memory: 1.5G       # MySQL最多使用1.5GB内存
        reservations:
          cpus: '0.3'
          memory: 512M

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: baby-feeding-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - baby-network
    restart: unless-stopped
    # 资源限制配置
    deploy:
      resources:
        limits:
          cpus: '0.3'        # Redis最多使用0.3核
          memory: 256M       # Redis最多使用256MB内存
        reservations:
          cpus: '0.1'
          memory: 128M

  # Nginx反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: baby-feeding-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - baby-network
    restart: unless-stopped
    profiles:
      - production

networks:
  baby-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
